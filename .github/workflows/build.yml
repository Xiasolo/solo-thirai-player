  android:
    name: Android app (.apk)
    needs: source
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Android project
        run: |
          flutter create --org com.thirai --project-name thirai_player --platforms=android .
          rm -rf test
          cp platform_overrides/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp platform_overrides/android/MainActivity.kt android/app/src/main/kotlin/com/thirai/thirai_player/MainActivity.kt
          cp -r platform_overrides/android/res/. android/app/src/main/res/
          cat > android/fix_sdk.gradle <<'EOF'
          subprojects { p ->
              def fix = {
                  if (p.name != 'app' && p.extensions.findByName('android') != null) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (p.state.executed) { fix() } else { p.afterEvaluate { fix() } }
          }
          EOF
          if [ -f android/build.gradle.kts ]; then
            echo 'apply(from = "fix_sdk.gradle")' >> android/build.gradle.kts
          else
            echo "apply from: 'fix_sdk.gradle'" >> android/build.gradle
          fi
          flutter pub get
      - name: Build APK
        run: |
          cp platform_overrides/android/signing/thirai.jks android/app/thirai.jks
          if [ -f android/app/build.gradle.kts ]; then cat platform_overrides/android/app_signing.kts >> android/app/build.gradle.kts; else echo "no build.gradle.kts"; exit 1; fi
          flutter build apk --release --build-name=$APP_VERSION --build-number=${{ github.run_number }} --dart-define=APP_VERSION=$APP_VERSION
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SoloThiraiPlayer-Android-$APP_VERSION.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SoloThirai-Android
          path: dist/*.apk

  windows:
    name: Windows installer (.exe)
    needs: source
    runs-on: windows-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { name: source, path: . }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Prepare Windows project
        shell: pwsh
        run: |
          flutter create --org com.thirai --project-name thirai_player --platforms=windows .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"thirai_player"', 'L"Solo Thirai Player"' | Set-Content $f
          $rc = "windows/runner/Runner.rc"
          (Get-Content $rc) -replace '"thirai_player"', '"Solo Thirai Player"' | Set-Content $rc
          Copy-Item platform_overrides/windows/app_icon.ico windows/runner/resources/app_icon.ico -Force
          flutter pub get
      - name: Build EXE
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }} --dart-define=APP_VERSION=${{ env.APP_VERSION }}
      - name: Build installer + portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APP_VERSION" installer\thirai.iss
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "dist/SoloThiraiPlayer-Windows-Portable-$env:APP_VERSION.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SoloThirai-Windows
          path: dist/*

  release:
    name: Publish downloads
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: SoloThirai-*
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Solo Thirai Player v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows: SoloThiraiPlayer-Setup-${{ env.APP_VERSION }}.exe download panni install pannunga.
            Android: SoloThiraiPlayer-Android-${{ env.APP_VERSION }}.apk download panni install pannunga.
          files: dist/*
