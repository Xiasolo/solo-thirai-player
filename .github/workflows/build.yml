name: Build Solo Thirai Player

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_VERSION: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform files
        run: |
          flutter create --org com.thirai --project-name thirai_player --platforms=android .
          rm -rf test
          cp platform_overrides/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          cp platform_overrides/android/MainActivity.kt android/app/src/main/kotlin/com/thirai/thirai_player/MainActivity.kt
          cat > android/fix_sdk.gradle <<'EOF'
          subprojects { p ->
              def fix = {
                  if (p.name != 'app' && p.extensions.findByName('android') != null) {
                      p.android.compileSdkVersion 36
                  }
              }
              if (p.state.executed) { fix() } else { p.afterEvaluate { fix() } }
          }
          EOF
          if [ -f android/build.gradle.kts ]; then
            echo 'apply(from = "fix_sdk.gradle")' >> android/build.gradle.kts
          else
            echo "apply from: 'fix_sdk.gradle'" >> android/build.gradle
          fi

      - run: flutter pub get
      - name: Build APK
        run: |
          flutter build apk --release --build-name=$APP_VERSION --build-number=${{ github.run_number }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/SoloThiraiPlayer-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/SoloThiraiPlayer-Android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Windows platform files
        shell: pwsh
        run: |
          flutter create --org com.thirai --project-name thirai_player --platforms=windows .
          Remove-Item -Recurse -Force test -ErrorAction SilentlyContinue
          $f = "windows/runner/main.cpp"
          (Get-Content $f) -replace 'L"thirai_player"', 'L"Solo Thirai Player"' | Set-Content $f

      - run: flutter pub get
      - name: Build EXE
        run: flutter build windows --release --build-name=${{ env.APP_VERSION }} --build-number=${{ github.run_number }}

      - name: Build installer + portable zip
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVer=$env:APP_VERSION" installer\thirai.iss
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath dist/SoloThiraiPlayer-Windows-Portable.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}
          name: Solo Thirai Player v${{ env.APP_VERSION }}
          target_commitish: ${{ github.sha }}
          body: |
            **Windows:** `SoloThiraiPlayer-Setup-${{ env.APP_VERSION }}.exe` download panni install pannunga (illa Portable zip).
            **Android:** `SoloThiraiPlayer-Android.apk` phone-la install pannunga.
          files: dist/*
